<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colisão · Física Realista</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0b1a2e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 16px;
      margin: 0;
    }
    .game-wrapper {
      max-width: 820px;
      width: 100%;
    }
    #startScreen {
      background: #1e3b4f;
      border-radius: 60px 60px 40px 40px;
      padding: 40px 30px 50px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 1px 4px #7baec9;
      border: 1px solid #5b8c9e;
      text-align: center;
      transition: opacity 0.4s ease, transform 0.3s ease;
    }
    #startScreen h1 {
      font-size: 3.8rem;
      font-weight: 700;
      color: #f2e8d5;
      text-shadow: 0 6px 0 #0f2838, 0 10px 25px #00000066;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }
    #startScreen .subtitle {
      font-size: 1.8rem;
      color: #b4d9ed;
      background: #143141;
      display: inline-block;
      padding: 0 28px;
      border-radius: 60px;
      font-weight: 300;
      letter-spacing: 6px;
      margin-bottom: 30px;
      border: 1px solid #3f7188;
    }
    .grupo-nomes {
      background: #132d3d;
      padding: 14px 24px;
      border-radius: 60px;
      display: inline-block;
      font-size: 1.6rem;
      font-weight: 500;
      color: #d4e9ff;
      box-shadow: inset 0 -3px 0 #0b202e;
      margin-bottom: 38px;
      letter-spacing: 1px;
    }
    .grupo-nomes span {
      display: inline-block;
      margin: 0 8px;
    }
    .grupo-nomes .nome {
      background: #1f4055;
      padding: 0 16px;
      border-radius: 40px;
      margin: 0 4px;
    }
    #startBtn {
      background: #e6b13e;
      border: none;
      font-size: 2.2rem;
      font-weight: 700;
      padding: 16px 50px;
      border-radius: 80px;
      color: #1e2f3a;
      box-shadow: 0 8px 0 #7f5f24, 0 8px 25px #00000077;
      cursor: pointer;
      transition: all 0.08s linear;
      border: 1px solid #ffd966;
      letter-spacing: 3px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }
    #startBtn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #7f5f24;
    }
    #startBtn i {
      font-style: normal;
      font-size: 2rem;
    }
    #gameContainer {
      display: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #gameContainer.active {
      display: block;
      opacity: 1;
    }
    .game-card {
      background: #1e3b4f;
      padding: 24px 24px 30px;
      border-radius: 48px 48px 32px 32px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.7), inset 0 1px 4px rgba(255,255,240,0.15);
      border: 1px solid #5b8c9e;
      width: 100%;
    }
    h2 {
      text-align: center;
      font-weight: 500;
      letter-spacing: 2px;
      color: #f2e8d5;
      text-shadow: 0 3px 0 #0f2838;
      margin: -6px 0 10px 0;
      font-size: 1.7rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    h2 small {
      font-size: 1rem;
      background: #2c5368;
      padding: 0 18px;
      border-radius: 60px;
      color: #d4e9ff;
      font-weight: 400;
    }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 800 / 460;
      background: #b3d6e8;
      background-image: radial-gradient(circle at 20% 30%, #d4edff 5%, #8ab3cc 80%);
      border-radius: 40px;
      box-shadow: inset 0 -6px 0 #3d667b, 0 12px 28px rgba(0,0,0,0.6);
      margin: 6px 0 16px 0;
      cursor: pointer;
      touch-action: none;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: #143141;
      padding: 12px 20px;
      border-radius: 100px;
      box-shadow: inset 0 3px 6px #0b1f2b, 0 6px 8px rgba(0,0,0,0.3);
      border: 1px solid #46758b;
    }
    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1f4055;
      padding: 4px 16px 4px 14px;
      border-radius: 40px;
      color: #ebf7ff;
      font-weight: 500;
      font-size: 0.95rem;
      box-shadow: inset 0 -2px 0 #0f2c3d;
    }
    .badge span {
      background: #00000030;
      padding: 0 10px;
      border-radius: 30px;
      font-weight: 700;
      color: #ffecbf;
    }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .controls button {
      background: #e6b13e;
      border: none;
      color: #1e2f3a;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 60px;
      font-size: 0.95rem;
      box-shadow: 0 4px 0 #7f5f24, 0 4px 12px rgba(0,0,0,0.4);
      transition: all 0.06s linear;
      cursor: pointer;
      border: 1px solid #ffd966;
    }
    .controls button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #7f5f24;
    }
    .controls button.reset {
      background: #da7b7b;
      border-color: #f7bebe;
      box-shadow: 0 4px 0 #7a4040;
      color: #1f1b1b;
    }
    .controls button.reset:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #7a4040;
    }
    .info-text {
      color: #b4d9ed;
      text-align: center;
      margin: 14px 0 0 0;
      font-size: 0.9rem;
      background: #1f3749;
      padding: 6px 12px;
      border-radius: 80px;
      display: inline-block;
      border: 1px solid #3f7188;
    }
    .info-text i {
      font-style: normal;
      display: inline-block;
      background: #132d3d;
      padding: 0 12px;
      border-radius: 30px;
      margin: 0 4px;
    }
    .key-hint {
      color: #c2dbea;
      font-size: 0.85rem;
      background: #0f293b;
      padding: 4px 14px;
      border-radius: 30px;
      display: inline-flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      border: 1px solid #3f7188;
    }
    .key-hint kbd {
      background: #1f4055;
      padding: 0 10px;
      border-radius: 12px;
      color: #ffd966;
      font-weight: 700;
    }
    .footer-center {
      display: flex;
      justify-content: center;
      margin-top: 6px;
    }
    .mass-indicators {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
      background: #0f293b;
      padding: 6px 18px;
      border-radius: 60px;
      border: 1px solid #3f7188;
      margin-top: 6px;
    }
    .mass-indicators .item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #d4e9ff;
      font-weight: 500;
      font-size: 0.9rem;
    }
    .mass-indicators .dot {
      display: inline-block;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid #ffffff66;
    }
    @media (max-width: 550px) {
      #startScreen h1 { font-size: 2.5rem; }
      .grupo-nomes { font-size: 1.2rem; padding: 10px 16px; }
      #startBtn { font-size: 1.6rem; padding: 12px 30px; }
      .stats { flex-direction: column; align-items: stretch; }
      .controls { justify-content: center; }
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <!-- TELA INICIAL -->
  <div id="startScreen">
    <h1>⚡ COLISÕES</h1>
    <div class="subtitle">TRABALHO DE FÍSICA</div>
    <div class="grupo-nomes">
      <span class="nome">Kauã Diego</span>
      <span class="nome">Thiago</span>
      <span class="nome">João Eduardo</span>
    </div>
    <button id="startBtn"><i>▶</i> INICIAR JOGO</button>
  </div>

  <!-- JOGO -->
  <div id="gameContainer">
    <div class="game-card">
      <h2>
        ⛹️‍♂️ COLISÃO REALISTA <small>basquete · vôlei · pequena</small>
      </h2>
      <canvas id="gameCanvas" width="800" height="460"></canvas>

      <div class="stats">
        <div class="badge">⚡ <span id="energyDisplay">0.0</span> J</div>
        <div class="badge">🏀 <span id="massDisplay">3.0</span> kg</div>
        <div class="controls">
          <button id="dropBtn">⬇️ QUEDA</button>
          <button id="resetBtn" class="reset">⟳ REINICIAR</button>
        </div>
      </div>

      <div class="footer-center">
        <div class="mass-indicators">
          <span class="item"><span class="dot" style="background:#e06b3d;"></span> Basquete: <strong>2.0 kg</strong></span>
          <span class="item"><span class="dot" style="background:#3b8fc2;"></span> Vôlei: <strong>0.8 kg</strong></span>
          <span class="item"><span class="dot" style="background:#e6e6e6;"></span> Pequena: <strong>0.2 kg</strong></span>
        </div>
      </div>

      <div class="footer-center">
        <div class="key-hint">
          <span><kbd>W</kbd>↑ <kbd>S</kbd>↓ <span style="color:#e06b3d;">●</span> basquete</span>
          <span><kbd>I</kbd>↑ <kbd>K</kbd>↓ <span style="color:#3b8fc2;">●</span> vôlei</span>
          <span><kbd>↑</kbd> <kbd>↓</kbd> <span style="color:#e6e6e6;">●</span> pequena</span>
        </div>
      </div>
      <div class="footer-center">
        <div class="info-text">
          <i>🟠 2.0 kg</i>  <i>🔵 0.8 kg</i>  <i>⚪ 0.2 kg</i>  —  clique no canvas para lançar
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- ELEMENTOS DA TELA INICIAL / JOGO ----------
    const startScreen = document.getElementById('startScreen');
    const gameContainer = document.getElementById('gameContainer');
    const startBtn = document.getElementById('startBtn');

    startBtn.addEventListener('click', function() {
      startScreen.style.opacity = '0';
      startScreen.style.transform = 'scale(0.96)';
      setTimeout(() => {
        startScreen.style.display = 'none';
        gameContainer.classList.add('active');
      }, 300);
    });

    // ---------- CANVAS E CONFIGURAÇÕES ----------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const energySpan = document.getElementById('energyDisplay');
    const massSpan = document.getElementById('massDisplay');

    // ---------- CONSTANTES FÍSICAS REALISTAS ----------
    const GRAVITY = 0.4;
    const FLOOR_Y = 410;
    const WALL_LEFT = 30;
    const WALL_RIGHT = 770;
    const AIR_RESISTANCE = 0.9995; // Arrasto do ar (muito leve)
    const FRICTION = 0.98; // Atrito com o chão (perda de energia)

    // ---------- BOLAS ----------
    const BASKETBALL = { radius: 24, mass: 2.0, color: '#e06b3d', label: '🏀', restitution: 0.75 };
    const VOLLEYBALL = { radius: 20, mass: 0.8, color: '#3b8fc2', label: '🏐', restitution: 0.70 };
    const SMALLBALL  = { radius: 14, mass: 0.2, color: '#e6e6e6', label: '⚪', restitution: 0.65 };

    let balls = [];

    function initBalls() {
      return [
        { 
          x: 200, y: 120, vx: 0, vy: 0,
          radius: BASKETBALL.radius, mass: BASKETBALL.mass, 
          color: BASKETBALL.color, label: BASKETBALL.label,
          restitution: BASKETBALL.restitution,
          id: 'basquete',
          rotation: 0, // rotação para efeito visual
          angularVel: 0
        },
        { 
          x: 400, y: 100, vx: 0, vy: 0,
          radius: VOLLEYBALL.radius, mass: VOLLEYBALL.mass,
          color: VOLLEYBALL.color, label: VOLLEYBALL.label,
          restitution: VOLLEYBALL.restitution,
          id: 'volei',
          rotation: 0,
          angularVel: 0
        },
        { 
          x: 600, y: 80, vx: 0, vy: 0,
          radius: SMALLBALL.radius, mass: SMALLBALL.mass,
          color: SMALLBALL.color, label: SMALLBALL.label,
          restitution: SMALLBALL.restitution,
          id: 'pequena',
          rotation: 0,
          angularVel: 0
        }
      ];
    }

    let isRunning = true;

    function resetPositions() {
      balls = initBalls();
      for (let b of balls) { 
        b.vx = 0; 
        b.vy = 0;
        b.rotation = 0;
        b.angularVel = 0;
      }
      updateEnergyDisplay();
      updateMassDisplay();
    }

    function computeTotalEnergy() {
      let total = 0;
      for (let b of balls) {
        const speed = Math.hypot(b.vx, b.vy);
        total += 0.5 * b.mass * speed * speed;
      }
      return total;
    }

    function updateEnergyDisplay() {
      energySpan.textContent = computeTotalEnergy().toFixed(1);
    }

    function updateMassDisplay() {
      const totalMass = balls.reduce((sum, b) => sum + b.mass, 0);
      massSpan.textContent = totalMass.toFixed(1);
    }

    // ---------- COLISÃO PERFEITAMENTE ELÁSTICA (mais realista) ----------
    function resolveCollisions() {
      const len = balls.length;
      for (let i = 0; i < len; i++) {
        for (let j = i + 1; j < len; j++) {
          const a = balls[i];
          const b = balls[j];
          
          // Distância entre os centros
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.hypot(dx, dy);
          const minDist = a.radius + b.radius;
          
          if (dist < minDist && dist > 0.001) {
            // Vetor normal de colisão
            const nx = dx / dist;
            const ny = dy / dist;
            
            // Separar as bolas para evitar overlapp (com suavidade)
            const overlap = (minDist - dist) * 0.5;
            a.x -= nx * overlap * 1.02;
            a.y -= ny * overlap * 1.02;
            b.x += nx * overlap * 1.02;
            b.y += ny * overlap * 1.02;
            
            // Velocidades relativas
            const dvx = a.vx - b.vx;
            const dvy = a.vy - b.vy;
            const relVn = dvx * nx + dvy * ny;
            
            // Só resolve se estiverem se aproximando
            if (relVn > 0) continue;
            
            // Coeficiente de restituição (média ponderada)
            const e = (a.restitution * a.mass + b.restitution * b.mass) / (a.mass + b.mass);
            
            // Massa total
            const totalMass = a.mass + b.mass;
            
            // Impulso (colisão elástica com restituição)
            const impulse = -(1 + e) * relVn / totalMass;
            
            // Aplicar impulso
            a.vx += impulse * b.mass * nx;
            a.vy += impulse * b.mass * ny;
            b.vx -= impulse * a.mass * nx;
            b.vy -= impulse * a.mass * ny;
            
            // Efeito de rotação (spin) na colisão - mais realista
            const tangencialX = -ny;
            const tangencialY = nx;
            const relVt = (a.vx - b.vx) * tangencialX + (a.vy - b.vy) * tangencialY;
            
            // Transferir parte da energia para rotação
            const spinTransfer = 0.15;
            a.angularVel += relVt * spinTransfer / a.radius;
            b.angularVel -= relVt * spinTransfer / b.radius;
          }
        }
      }
    }

    // ---------- FÍSICA ATUALIZADA ----------
    function updatePhysics() {
      // Aplicar gravidade e movimento
      for (let b of balls) {
        // Gravidade
        b.vy += GRAVITY;
        
        // Resistência do ar (arrasto)
        b.vx *= AIR_RESISTANCE;
        b.vy *= AIR_RESISTANCE;
        
        // Atualizar posição
        b.x += b.vx;
        b.y += b.vy;
        
        // Atualizar rotação (spin)
        b.rotation += b.angularVel * 0.02;
        b.angularVel *= 0.99; // Amortecimento da rotação
      }
      
      // Resolver colisões entre bolas (2 iterações para maior estabilidade)
      for (let iter = 0; iter < 2; iter++) {
        resolveCollisions();
      }
      
      // Colisões com paredes e chão (com física realista)
      for (let b of balls) {
        // Chão
        if (b.y + b.radius > FLOOR_Y) {
          b.y = FLOOR_Y - b.radius;
          if (b.vy > 0) {
            // Perda de energia no chão (restituição)
            b.vy *= -b.restitution;
            // Atrito com o chão (reduz velocidade horizontal)
            b.vx *= FRICTION;
            // Transferir energia para rotação
            b.angularVel += b.vx * 0.02 / b.radius;
            if (Math.abs(b.vy) < 0.2) b.vy = 0;
          }
        }
        
        // Parede esquerda
        if (b.x - b.radius < WALL_LEFT) {
          b.x = WALL_LEFT + b.radius;
          if (b.vx < 0) {
            b.vx *= -b.restitution * 0.9;
            b.angularVel += b.vy * 0.02 / b.radius;
          }
        }
        
        // Parede direita
        if (b.x + b.radius > WALL_RIGHT) {
          b.x = WALL_RIGHT - b.radius;
          if (b.vx > 0) {
            b.vx *= -b.restitution * 0.9;
            b.angularVel -= b.vy * 0.02 / b.radius;
          }
        }
        
        // Teto
        if (b.y - b.radius < 10) {
          b.y = 10 + b.radius;
          if (b.vy < 0) {
            b.vy *= -b.restitution * 0.8;
          }
        }
      }
      
      updateEnergyDisplay();
      updateMassDisplay();
    }

    // ---------- DESENHO COM ROTAÇÃO ----------
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Chão
      ctx.fillStyle = '#6e4f3a';
      ctx.fillRect(0, FLOOR_Y, canvas.width, 6);
      ctx.fillStyle = '#8b6b52';
      ctx.fillRect(0, FLOOR_Y+4, canvas.width, 8);
      ctx.fillStyle = '#ffffff30';
      ctx.fillRect(0, FLOOR_Y-2, canvas.width, 3);

      for (let b of balls) {
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rotation);
        
        // Sombra
        ctx.shadowColor = 'rgba(0,0,0,0.2)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 6;
        
        // Gradiente 3D
        const grd = ctx.createRadialGradient(-6, -8, 4, 0, 0, b.radius+2);
        grd.addColorStop(0, '#fff8f0');
        grd.addColorStop(0.3, b.color);
        grd.addColorStop(1, '#1f1f1f');
        
        ctx.beginPath();
        ctx.arc(0, 0, b.radius, 0, Math.PI*2);
        ctx.fillStyle = grd;
        ctx.fill();
        
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.strokeStyle = '#00000055';
        ctx.lineWidth = 1.2;
        ctx.stroke();
        
        // Linhas de rotação (efeito de giro)
        ctx.strokeStyle = '#ffffff30';
        ctx.lineWidth = 1.5;
        for (let i = 0; i < 3; i++) {
          const angle = (i / 3) * Math.PI * 2 + b.rotation;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(angle) * b.radius * 0.85, Math.sin(angle) * b.radius * 0.85);
          ctx.stroke();
        }
        
        // Círculo central
        ctx.beginPath();
        ctx.arc(0, 0, b.radius * 0.25, 0, Math.PI*2);
        ctx.fillStyle = '#ffffff30';
        ctx.fill();
        
        ctx.restore();
        
        // Label (fora da rotação para legibilidade)
        ctx.font = `${b.radius * 0.9}px 'Segoe UI', system-ui, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#0b0b0b';
        ctx.fillText(b.label, b.x, b.y-2);
        
        // Massa abaixo da bola
        ctx.font = 'bold 10px monospace';
        ctx.fillStyle = '#f0faff';
        ctx.shadowColor = '#00000080';
        ctx.shadowBlur = 4;
        ctx.fillText(`${b.mass.toFixed(1)}kg`, b.x, b.y + b.radius + 14);
        ctx.shadowBlur = 0;
      }
      
      ctx.font = '13px "Segoe UI", sans-serif';
      ctx.fillStyle = '#192f3d';
      ctx.globalAlpha = 0.35;
      ctx.fillText('clique para lançar', 20, 30);
      ctx.globalAlpha = 1.0;
    }

    function gameLoop() {
      if (isRunning) {
        updatePhysics();
        draw();
        requestAnimationFrame(gameLoop);
      }
    }

    // ---------- LANÇAMENTO ----------
    function launchBalls(clickX, clickY) {
      for (let b of balls) {
        const dx = b.x - clickX;
        const dy = b.y - clickY;
        const dist = Math.hypot(dx, dy);
        if (dist < 1) continue;
        const normX = dx / dist;
        const normY = dy / dist;
        const impulse = 5.0 / (b.mass + 0.1);
        b.vx += normX * impulse * 1.8;
        b.vy += normY * impulse * 1.8 - 3.5;
        // Adicionar spin baseado na direção
        b.angularVel += (Math.random() - 0.5) * 0.3;
        const maxSpeed = 20;
        const sp = Math.hypot(b.vx, b.vy);
        if (sp > maxSpeed) {
          b.vx = (b.vx / sp) * maxSpeed;
          b.vy = (b.vy / sp) * maxSpeed;
        }
      }
      updateEnergyDisplay();
    }

    // ---------- CONTROLES POR TECLADO ----------
    function handleKeyDown(e) {
      const key = e.key;
      // Basquete: W / S
      if (key === 'w' || key === 'W') {
        const b = balls.find(b => b.id === 'basquete');
        if (b) { b.vy -= 2.5; b.vx += (Math.random()-0.5)*0.5; }
        e.preventDefault();
      } else if (key === 's' || key === 'S') {
        const b = balls.find(b => b.id === 'basquete');
        if (b) { b.vy += 2.5; b.vx += (Math.random()-0.5)*0.5; }
        e.preventDefault();
      }
      // Vôlei: I / K
      else if (key === 'i' || key === 'I') {
        const b = balls.find(b => b.id === 'volei');
        if (b) { b.vy -= 3.0; b.vx += (Math.random()-0.5)*0.5; }
        e.preventDefault();
      } else if (key === 'k' || key === 'K') {
        const b = balls.find(b => b.id === 'volei');
        if (b) { b.vy += 3.0; b.vx += (Math.random()-0.5)*0.5; }
        e.preventDefault();
      }
      // Pequena: setas
      else if (key === 'ArrowUp') {
        const b = balls.find(b => b.id === 'pequena');
        if (b) { b.vy -= 4.0; b.vx += (Math.random()-0.5)*0.6; }
        e.preventDefault();
      } else if (key === 'ArrowDown') {
        const b = balls.find(b => b.id === 'pequena');
        if (b) { b.vy += 4.0; b.vx += (Math.random()-0.5)*0.6; }
        e.preventDefault();
      }
    }

    // ---------- EVENTOS ----------
    function handleCanvasClick(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      launchBalls((e.clientX - rect.left) * scaleX, (e.clientY - rect.top) * scaleY);
    }

    function handleTouch(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      launchBalls((touch.clientX - rect.left) * scaleX, (touch.clientY - rect.top) * scaleY);
    }

    function dropBalls() {
      for (let b of balls) {
        b.x = 150 + Math.random() * 500;
        b.y = 60 + Math.random() * 40;
        b.vx = (Math.random() - 0.5) * 1.5;
        b.vy = 0.5 + Math.random() * 1.5;
        b.angularVel = (Math.random() - 0.5) * 0.2;
      }
      updateEnergyDisplay();
    }

    // ---------- INICIALIZAÇÃO ----------
    resetPositions();

    canvas.addEventListener('click', handleCanvasClick);
    canvas.addEventListener('touchstart', handleTouch, { passive: false });
    document.addEventListener('keydown', handleKeyDown);

    document.getElementById('dropBtn').addEventListener('click', dropBalls);
    document.getElementById('resetBtn').addEventListener('click', resetPositions);

    gameLoop();
  })();
</script>
</body>
</html>
